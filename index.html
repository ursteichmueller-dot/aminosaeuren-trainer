.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select{background:var(--cd);border:1px solid var(--bd);padding:6px 8px;border-radius:6px}

.card{background:var(--cd);border:1px solid var(--bd);border-left-width:6px;border-radius:6px;padding:7px 9px;text-align:left;cursor:pointer;transition:opacity .15s}

.fig{background:var(--bg);border-radius:6px;padding:6px;margin:8px 0}
svg{display:block;margin:auto;color:var(--fg);width:100%}
svg line{stroke:currentColor;stroke-width:2;stroke-linecap:round}svg polygon{fill:currentColor}
svg text{font:600 15px system-ui;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:13px;margin:6px 0}

.btn{background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:6px 12px;cursor:pointer}

.pk td:last-child{font-variant-numeric:tabular-nums;font-weight:600}tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
.kd{height:10px;border-radius:5px;background:linear-gradient(90deg,#2f8fd8,#ccd,#e08a2e);position:relative;margin:6px 0 2px}
.kd i{position:absolute;top:-4px;width:4px;height:18px;background:var(--fg);border-radius:2px}
.kdl{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
input[type=range]{width:100%}.big{font:700 20px Georgia,serif}
.gl{display:flex;flex-direction:column;gap:6px}.gl button{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between}
.gl button.on{border-color:var(--ac);outline:1px solid var(--ac)}.gl small{color:var(--mu)}
.vs{display:flex;gap:10px;flex-wrap:wrap}.vs figure{margin:0;flex:1 1 200px;background:var(--bg);border-radius:6px;padding:8px;transition:opacity .2s}
figcaption{text-align:center;font-size:13px;color:var(--mu)}li{margin:4px 0}
a.ch{display:inline-block;border:1px solid var(--bd);border-radius:14px;padding:1px 10px;margin:2px;color:var(--ac);text-decoration:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.opts button{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:10px;cursor:pointer}
.opts button.ok{background:#1c9a5a;color:#fff}.opts button.no{background:#c8382e;color:#fff}
.chip{border:1px solid var(--bd);background:var(--cd);border-radius:14px;padding:1px 10px;margin:2px;cursor:pointer;font-size:13px}.chip.on{background:#ffb400;border-color:#ffb400;color:#1a1a1a}.chip.off{opacity:.65}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}.kcard{display:flex;flex-direction:column;gap:4px}details{margin:4px 0}summary{cursor:pointer;font-size:13px}

F('ind','Indol',TRP,'Trp-Seitenkette','Bicyclisch aromatisch, UV 280 nm, N–H als H-Donor; unpolarste aromatische Seitenkette.',TRPC,1),
F('aro','Phenyl (Aromat)',PH,'Phe-/Tyr-Seitenkette','Unpolarer aromatischer Ring (6 π-Elektronen); hydrophobe Wechselwirkungen, π-Stapelung.',PHC,1)];
const HLM={S:{alk:[1,2]},T:{alk:[1,2]},C:{thi:[1,2]},Y:{alk:[5,8],aro:[2,3,4,5,6,7]},F:{aro:[2,3,4,5,6,7]},M:{sul:[2,3,4]},N:{amd:[2,3,4]},Q:{amd:[3,4,5]},D:{cooh:[2,3,4]},E:{cooh:[3,4,5]},K:{ami:[4,5]},R:{gua:[4,5,6,7]},H:{imi:[2,3,4,5,6]},W:{ind:[2,3,4,5,6,7,8,9,10]}};
const hl=(c,k)=>[...(k=='ami'?['N']:[]),...(k=='cooh'?['C']:[]),...((HLM[c]||{})[k]||[])];

// ---------- Tab Aminosäuren ----------
let sel=0,D=0,pH=7,hg=null,kc=0,fs=0,kw=0,zw=1;
Object.values(CL).forEach((v,i)=>$('#f1').add(new Option(v[0],Object.keys(CL)[i])));
function grid(){const f=[$('#f1').value,$('#f2').value,$('#f3').value];
 $('#grid').innerHTML=A.map((a,i)=>{const ok=(!f[0]||a[3]==f[0])&&(!f[1]||hyd(a[5])==f[1])&&(f[2]===''||a[4]==f[2])&&(!hg||hl(a[2],hg).length>0);
  return `<button class="card${i==sel?' sel':''}" style="border-left-color:${CL[a[3]][1]};opacity:${ok?1:.22}" onclick="sel=${i};D=0;grid();det()"><b>${a[0]}</b><small>${a[1]} · ${a[2]}</small></button>`}).join('')}
['f1','f2','f3'].forEach(i=>$('#'+i).onchange=grid);
function upd(){const a=A[sel],c=chg(a,pH);$('#chg').innerHTML=`Nettoladung bei pH ${fm(pH.toFixed(1))}: <span class="big" style="color:${c>.1?'#2a68d8':c<-.1?'#d8402f':'inherit'}">${c>0?'+':''}${fm(c.toFixed(2))}</span> <span class="mu">(pI = ${fm(a[9])}: dort ≈ 0)</span>`}
function det(){const a=A[sel],k=CL[a[3]],H=hg?hl(a[2],hg):[];
 $('#det').innerHTML=`<h2 style="border-left:6px solid ${k[1]};padding-left:10px">${a[0]} <small>${a[1]} · ${a[2]}</small></h2>
 <div class="fig row" style="align-items:flex-start;justify-content:center">${[['Kreuz-Darstellung (Lehrbuch)',draw(bb(a),{D,zw,hl:H})],kw?['Keilstrich-Darstellung',draw(bb(a),{D,zw,W:1,hl:H})]:0,fs?['Fischer-Projektion',fisch(a,D,H,zw)]:0].filter(Boolean).map(x=>`<div style="flex:1 1 200px">${x[1]}<div class="mu" style="text-align:center">${x[0]}</div></div>`).join('')}</div>
 ${chips(a)}<div class="row"><button class="btn" onclick="D=1-D;det()">${D?'D':'L'}-Form → ${D?'L':'D'}-Form zeigen</button><button class="btn" onclick="kw=1-kw;det()">Keilstrich ${kw?'ausblenden':'einblenden'}</button><button class="btn" onclick="fs=1-fs;det()">Fischer ${fs?'ausblenden':'einblenden'}</button><button class="btn" onclick="zw=1-zw;det()">${zw?'Neutrale Form':'Zwitterion'}</button><span>${D?'D':'L'}-${a[0]}: <b>${stc(a[2],D)}</b></span></div>
 <p class="mu">Kreuz-Darstellung: flache Lehrbuchform ohne Stereoinformation (als L-Form zu lesen; bei D gespiegelt). Keilstrich: Keil = zum Betrachter, gestrichelt = vom Betrachter weg; L-Form: R auf dem Keil, H gestrichelt.${fs?' Fischer: waagerechte Bindungen zeigen zum Betrachter, senkrechte weg; COOH oben, R unten; L: H₂N links, D: H₂N rechts.':''} Bei Ile und Thr ist nur das Cα-Zentrum gezeichnet.</p>
 <span class="tag" style="background:${k[1]}">${k[0]}</span><span class="tag">${hyd(a[5])}</span><span class="tag">${a[4]?'aromatisch':'aliphatisch'}</span>
 <div class="kd"><i style="left:calc(${(a[5]+4.5)/9*100}% - 2px)"></i></div><div class="kdl"><span>hydrophil −4,5</span><span>KD = ${fm(a[5])}</span><span>+4,5 hydrophob</span></div>
 <table class="pk" style="margin-top:10px"><tr><td>pKa α-COOH</td><td>${fm(a[6])}</td></tr><tr><td>pKa α-NH₃⁺</td><td>${fm(a[7])}</td></tr>
 ${a[8]!=null?`<tr><td>pKa Seitenkette (${'DECY'.includes(a[2])?'Säure':'Base'})</td><td>${fm(a[8])}</td></tr>`:''}<tr><td>Isoelektrischer Punkt pI</td><td>${fm(a[9])}</td></tr></table>
 <p style="margin:10px 0 2px"><label>pH <input type="range" min="0" max="14" step=".1" value="${pH}" oninput="pH=+this.value;upd()"></label></p><div id="chg"></div>
 <p>${a[10]}</p>`;upd()}

// ---------- Navigation zu einer Aminosäure ----------
function go(i){sel=i;D=0;show('A');grid();det()}

// ---------- Fischer-Projektion ----------
const FS={G:'H',A:'CH₃',V:'CH(CH₃)₂',L:'CH₂CH(CH₃)₂',I:'CH(CH₃)CH₂CH₃',P:'CH₂CH₂CH₂',M:'CH₂CH₂SCH₃',F:'CH₂–C₆H₅',W:'CH₂–Indol',S:'CH₂OH',T:'CH(OH)CH₃',C:'CH₂SH',Y:'CH₂–C₆H₄–OH',N:'CH₂CONH₂',Q:'CH₂CH₂CONH₂',D:'CH₂COOH',E:'CH₂CH₂COOH',K:'(CH₂)₄NH₂',R:'(CH₂)₃NHC(=NH)NH₂',H:'CH₂–Imidazol'};
function fisch(a,D,h,zw){
 const c=a[2],r=FS[c],u=L*1.1,w=Math.max(80,r.length*5+12),hs=new Set(h||[]),nx=D?u:-u,hx=-nx,pro=c=='P';
 let b='';if(hs.has('N'))b+=`<ellipse cx="${nx}" cy="0" rx="24" ry="16"/>`;if(hs.has('C'))b+=`<ellipse cx="0" cy="${-u}" rx="29" ry="16"/>`;
 if([...hs].some(x=>typeof x=='number'))b+=`<ellipse cx="0" cy="${u}" rx="${r.length*4.8+10}" ry="16"/>`;
 return `<svg viewBox="${-w} ${-u-26} ${2*w} ${2*u+26+(pro?54:36)}" style="max-width:${Math.min(2*w*1.5,300)}px;max-height:300px">
 <g style="opacity:.5;fill:#ffb400;stroke:none">${b}</g><line x1="0" y1="${-u}" x2="0" y2="${u}"/><line x1="${-u}" y1="0" x2="${u}" y2="0"/>
 ${pro?`<path d="M${nx},14 V${u+24} H0 V${u+11}" fill="none" stroke="currentColor" stroke-width="2"/>`:''}
 <text x="0" y="${-u}" fill="#d8402f">${zw?'COO⁻':'COOH'}</text><text x="${nx}" y="0" fill="#2a68d8">${zw?(pro?'⁺H₂N':'⁺H₃N'):(pro?'HN':'H₂N')}</text><text x="${hx}" y="0" fill="currentColor">H</text><text x="0" y="${u}" fill="currentColor">${r}</text></svg>`}

// ---------- Markierung & Katalog ----------
function chips(a){const c=f=>`<button class="chip${hl(a[2],f.k).length?'':' off'}${hg==f.k?' on':''}" onclick="pick('${f.k}')">${f.n}</button>`;
 const y=FG.filter(f=>hl(a[2],f.k).length),n=FG.filter(f=>!hl(a[2],f.k).length),f=FG.find(x=>x.k==hg),miss=f&&!hl(a[2],hg).length;
 return `<div><b style="font-size:13px">Funktionelle Gruppe markieren (nochmal klicken = aus):</b><br>${y.map(c).join('')}<details${miss?' open':''}><summary class="mu">weitere Gruppen (in ${a[0]} nicht enthalten)</summary>${n.map(c).join('')}</details>${f?`<p class="mu"><b>${f.n}</b> (${f.s}): ${f.d}${miss?`<br><i>Kommt in ${a[0]} nicht vor.</i>`:''}</p>`:''}</div>`}
function pick(k){hg=hg==k?null:k;grid();det()}
function kat(){
 $('#kg').innerHTML=FG.map((f,i)=>`<button class="card kcard${i==kc?' sel':''}" style="border-left-color:${f.x?'#ffb400':'var(--bd)'}" onclick="kc=${i};kat();scrollTo(0,0)"><b>${f.n}</b>${draw(f,{mh:90})}</button>`).join('');
 const f=FG[kc],w=A.map((a,i)=>hl(a[2],f.k).length?i:-1).filter(i=>i>=0);
 $('#kd').innerHTML=`<div class="row" style="align-items:flex-start"><div class="fig" style="flex:1 1 200px">${draw(f,{mh:190})}</div><div style="flex:2 1 280px"><h2>${f.n} <small>${f.s}</small></h2><p>${f.d}</p><p>${w.length?'Kommt vor in: '+w.map(i=>`<a class="ch" href="#" onclick="hg='${f.k}';go(${i});return false">${A[i][0]}</a>`).join(''):'<i>Kommt in keiner der 20 proteinogenen Aminosäuren vor.</i>'}</p>${w.length?`<button class="btn" onclick="markAll('${f.k}')">In den Aminosäuren markieren</button>`:''}${f.x?'<p class="mu">Zusätzlich wichtige Gruppe der Seitenketten (nicht in der Übersichtsgrafik).</p>':''}</div></div>`}
function markAll(k){hg=k;const i=A.findIndex(a=>hl(a[2],k).length);if(i>=0)sel=i;D=0;show('A');grid();det()}

// ---------- Navigation ----------
function show(t){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
grid();det();kat();
</script></body></html>
